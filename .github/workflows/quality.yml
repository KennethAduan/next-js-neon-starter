name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, Typecheck, Doctor, Fallow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Resolve diff base
        id: diff-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: React Doctor (changed files)
        run: bunx react-doctor --diff "${{ steps.diff-base.outputs.ref }}" --no-score

      - name: Fallow audit (changed files)
        run: bunx fallow audit --summary --changed-since "${{ steps.diff-base.outputs.ref }}"
